name: Generate contribution snake

on:
  # Generate a fresh animation every day at 00:15 UTC.
  schedule:
    - cron: "15 0 * * *"

  # Allow manual execution from the Actions tab.
  workflow_dispatch:

# Prevent overlapping scheduled or manually triggered runs.
concurrency:
  group: contribution-snake
  cancel-in-progress: true

# The workflow needs permission to publish generated SVG files
# to the output branch.
permissions:
  contents: write

jobs:
  generate:
    name: Generate and publish SVG files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVG files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
          keep_history: false
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
